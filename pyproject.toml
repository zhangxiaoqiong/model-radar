[project]
name = "llm-observatory"
version = "0.1.0"
description = "ODS/DWD/ADS warehouse for model analytics"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "alembic>=1.13",
    "pymysql>=1.1",
    "httpx>=0.27",
    "uuid6>=2024.1.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["packages", "apps"]
include = ["backend_core*", "ingestion*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
