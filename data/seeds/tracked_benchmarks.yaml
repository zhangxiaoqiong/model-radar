# LLM Observatory — tracked benchmarks seed (spec §37/§38)
# ~14 benchmarks. Each carries at least one version + one structured metric
# (spec §6: score_direction / normalization_method live on the metric).

- slug: swe-bench-verified
  name: SWE-bench Verified
  category: coding
  description: Resolved real GitHub issues in human-verified repositories
  official_url: https://www.swebench.com/
  dataset_public: true
  dynamic: false
  contamination_risk: medium
  version: verified
  metric:
    slug: resolved
    name: Resolved %
    unit: percent
    score_direction: higher_better
    normalization_method: minmax
  capabilities:
    - {slug: coding-repo-level, weight: 1.0}

- slug: aider-polyglot
  name: Aider Polyglot Benchmark
  category: coding
  description: Code editing across multiple languages
  official_url: https://aider.chat/docs/leaderboards/
  dataset_public: false
  dynamic: true
  contamination_risk: medium
  version: v2
  metric:
    slug: percent_solved
    name: % Solved
    unit: percent
    score_direction: higher_better
    normalization_method: minmax
  capabilities:
    - {slug: coding, weight: 0.6}
    - {slug: coding-code-generation, weight: 0.4}

- slug: livebench-coding
  name: LiveBench Coding
  category: coding
  description: Contamination-free coding subtask of LiveBench, regularly refreshed
  official_url: https://livebench.ai/
